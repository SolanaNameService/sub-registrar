[package]
name = "sub-registrar"
version = "0.2.0"
edition = "2018"
resolver = "2"
repository = "https://github.com/SolanaNameService/sub-registrar"
description = "This on-chain Solana program handles the registration of SNS sub-domains"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
no-entrypoint = []
test-bpf = []
devnet = ["sns-registrar/devnet"]

[dependencies]
sns-registrar = { version = "0.2.0", features = ["no-entrypoint"] }
solana-program = "4.0.0"
num_enum = "0.5.4"
borsh = { version = "1.7.0", features = ["derive"] }
thiserror = "1.0.24"
num-traits = "0.2"
num-derive = "0.3"
enumflags2 = "0.7.1"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
bonfida-utils = "0.9.2"
spl-name-service = { package = "spl-name-service-2", version = "0.5.0", features = [
    "no-entrypoint",
] }
bytemuck = "1.12.3"
unicode-segmentation = "1.10.1"
solana-security-txt = "1.1.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }

[dev-dependencies]
hexdump = "0.1.0"
solana-sdk = "4.0.1"
rand = "0.8.4"
arrayref = "0.3.6"
solana-program-test = { version = "4.2.2", features = ["agave-unstable-api"] }
spl-associated-token-account = { version = "8.0.0", features = [
    "no-entrypoint",
] }
tokio = { version = "1.6", features = ["macros"] }
random-string = "1.0.0"
async-trait = "0.1.80"

[lib]
crate-type = ["cdylib", "lib"]
